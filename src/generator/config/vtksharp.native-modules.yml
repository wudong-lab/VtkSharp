# yaml-language-server: $schema=../schemas/vtksharp.native-modules.schema.json
# All public exports share one statically linked VTK runtime.
schemaVersion: 1
strategyVersion: 2
vtkVersion: 9.7.0
platform: windows-x64

groups:
  - name: Unified
    target: VtkSharp.Native
    modules:
      - vtkCommonColor
      - vtkCommonComputationalGeometry
      - vtkCommonCore
      - vtkCommonDataModel
      - vtkCommonExecutionModel
      - vtkCommonMath
      - vtkCommonTransforms
      - vtkFiltersCore
      - vtkFiltersExtraction
      - vtkFiltersGeneral
      - vtkFiltersGeometry
      - vtkFiltersHybrid
      - vtkFiltersModeling
      - vtkFiltersPoints
      - vtkFiltersSources
      - vtkFiltersVerdict
      - vtkIOCore
      - vtkIOGeometry
      - vtkIOImage
      - vtkIOInfovis
      - vtkIOXML
      - vtkImagingCore
      - vtkImagingMath
      - vtkInteractionImage
      - vtkInteractionStyle
      - vtkInteractionWidgets
      - vtkRenderingAnnotation
      - vtkRenderingCore
      - vtkRenderingLabel
      - vtkRenderingOpenGL2
      - vtkRenderingUI
    initializationProviders:
      - vtkInteractionStyle
      - vtkRenderingOpenGL2
      - vtkRenderingUI
    # Use the default implementations; no optional accelerated/IO backend is selected.
    optionalInitializationModules:
      - vtkFiltersCore
      - vtkIOGeometry
      - vtkIOImage
    rationale: Keep public and private exports in one DLL with a single VTK implementation.

manualSourceOwnership:
  - source: vtkCommonCore/vtkFloatArray_export.cpp
    target: VtkSharp.Native
    rationale: Manual GetPointer export used by the managed float-array helper.
  - source: vtkCommonCore/vtkUnsignedCharArray_export.cpp
    target: VtkSharp.Native
    rationale: Manual SetUnsignedCharTuple export used by the managed color-array helper.
  - source: vtkCommonCore/vtkObjectBase_export.cpp
    target: VtkSharp.Native
    rationale: Manual base-object reference-count and deletion exports used by every wrapper.
  - source: vtkCommonCore/vtkObject_export.cpp
    target: VtkSharp.Native
    rationale: Manual vtkObject event and observer exports.
  - source: vtksharp_string.cpp
    target: VtkSharp.Native
    rationale: Shared UTF-8/string interop helpers used by generated exports.
